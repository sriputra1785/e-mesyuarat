<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>เข้าสู่ระบบ | ระบบบันทึกการประชุมออนไลน์</title>
<meta name="description" content="ระบบบันทึกการประชุมออนไลน์ระดับตำบล อำเภอ จังหวัด">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://sriputra1785.github.io/e-mesyuarat/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="top"></div>
<section id="landing">
  <div class="hero">
    <div class="wrap">
      <div class="hero-brand">
        <div class="logo">MS</div>
        <h1>ระบบบันทึกการประชุมออนไลน์</h1>
        <p>บันทึกการประชุม ติ๊กชื่อผู้เข้าร่วม แล้วออกรายงานได้ทันที</p>
        <div class="seal">แต่ละพื้นที่บันทึกได้เฉพาะเขตรับผิดชอบของตน<br>ส่วนกลางเห็นภาพรวมทั้งหมด</div>
      </div>
      <form class="lg" onsubmit="doLogin(event)">
        <h2>เข้าสู่ระบบ</h2>
        <label>รหัสผู้ใช้
          <input name="u" type="text" autocomplete="username" required placeholder="เช่น padat01" autocapitalize="off" spellcheck="false">
        </label>
        <label>รหัสผ่าน
          <input name="p" type="password" autocomplete="current-password" required placeholder="••••••••">
        </label>
        <div class="err" id="lerr" role="alert"></div>
        <button class="btn" type="submit">เข้าสู่ระบบ</button>
        <p style="margin:0;font-size:12px;color:var(--mut);text-align:center">รหัสผู้ใช้และรหัสผ่านได้รับจากส่วนกลาง</p>
      </form>
    </div>
  </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/core.js"></script>
<script src="js/auth.js"></script>
<script>
(function () {
  const q = new URLSearchParams(location.search).get('msg');
  if (q) {
    const el = document.getElementById('lerr');
    if (el) el.textContent = q;
  }
})();
</script>
</body>
</html>
